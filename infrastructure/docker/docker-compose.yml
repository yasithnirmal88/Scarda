services:
  db:
    # TimescaleDB-enabled PostgreSQL. Provides the `timescaledb` extension used
    # by the hypertable migrations for string_readings / weather_readings.
    image: timescale/timescaledb:2.17.2-pg16
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: solar_aim
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ../database/init.sql:/docker-entrypoint-initdb.d/001-init.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ../../backend
      dockerfile: ../infrastructure/docker/backend.Dockerfile
    ports:
      - "8000:8000"
    environment:
      APP_NAME: Solar AIM
      DEBUG: "false"
      # Live + historical data come from the Mock FusionSolar API, which is
      # Huawei-compatible. Swap HUAWEI_BASE_URL for the real Northbound URL
      # when company access is available.
      PROVIDER_TYPE: "huawei"
      HUAWEI_BASE_URL: "http://host.docker.internal:8001"
      DATABASE_URL: postgresql+psycopg2://postgres:postgres@db:5432/solar_aim
      SECRET_KEY: change-me-in-production
      ALGORITHM: HS256
      ACCESS_TOKEN_EXPIRE_MINUTES: "30"
      SCHEDULER_SIMULATOR_INTERVAL_MINUTES: "10"
      SCHEDULER_ENABLED: "true"
      HISTORICAL_LOOKBACK_DAYS: "14"
    depends_on:
      db:
        condition: service_healthy

  frontend:
    build:
      context: ../../frontend
      dockerfile: ../infrastructure/docker/frontend.Dockerfile
    ports:
      - "3000:80"
    depends_on:
      - backend

volumes:
  pgdata:
